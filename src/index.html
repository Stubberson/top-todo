<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do</title>
</head>
<body>
    <div class="sidebar-left">
        <div class="navigation">
            <button id="today-all">TODAY</button>
            <button id="important-all">IMPORTANT</button>
            <button id="completed-all">COMPLETED</button>
            <button id="new-project">NEW PROJECT</button>
        </div>
        <ul class="projects-list"></ul>
    </div>
    <div class="content-container"></div>
    <div class="sidebar-right"></div>
    <div class="footer">
        <button id="toggle-left">
            <svg id="chevron-left" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <polyline
                    points="60,30 40,50 60,70"
                    fill="none"
                    stroke="black"
                    stroke-width="3"
                />
            </svg>
        </button>
        <button id="toggle-right">
            <svg id="chevron-right" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <polyline
                    points="40,30 60,50 40,70"
                    fill="none"
                    stroke="black"
                    stroke-width="3"
                />
            </svg>
        </button>
    </div>
</body>
</html>
